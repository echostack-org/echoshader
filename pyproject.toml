[build-system]
requires = [
    "setuptools>=68",
    "setuptools_scm[toml]>=8",
]
build-backend = "setuptools.build_meta"

[project]
name = "echoshader"
dynamic = ["version"]
description = "Open Source Python package for building ocean sonar data visualizations."
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = { text = "MIT" }

authors = [
    { name = "Dingrui Lei", email = "leidingrui426@gmail.com" },
]

classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "aiohttp>=3.10.10",
    "dask>=2024.10.0",
    "echopype>=0.9.1",
    "fsspec>=2024.10.0",
    "geoviews>=1.13.1",
    "hvplot>=0.11.1",
    "jupyter_bokeh>=4.1.0",
    "netCDF4>=1.7.2",
    "numpy>=2.3.0",
    "pandas>=2.3.0",
    "panel>=1.5.3",
    "plotly>=6.0.0",
    "pyvista[jupyter]>=0.44.2",
    "xarray>=2025.1.0",
    "zarr>=3",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.30.0",
    "pre-commit>=4.1.0",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
]

test = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.1",
    "pytest-xdist>=3.7.0",
]

lint = [
    "check-manifest>=0.51",
    "codespell>=2.4.0",
    "mypy>=1.12.0",
    "numpydoc>=1.9.0",
    "pre-commit>=4.1.0",
    "pylint>=3.3.2",
    "ruff>=0.7.0",
]

docs = [
    "jupyter-book>=1.0.4",
    "linkify-it-py>=2.1.0",
    "myst-nb>=1.2.0",
    "numpydoc>=1.9.0",
    "sphinx>=8.1.0",
    "sphinx-automodapi>=0.19.0",
    "sphinx-comments",
    "sphinx-copybutton",
    "sphinx-external-toc>=1.1.0",
    "sphinx-panels",
    "sphinx-thebe",
    "sphinx-togglebutton>=0.4.4",
    "sphinx_book_theme>=1.1.4",
    "sphinx_jupyterbook_latex",
    "sphinx_rtd_theme>=3.0.2",
    "sphinxcontrib-mermaid>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/echostack-org/echoshader"
Repository = "https://github.com/echostack-org/echoshader"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["echoshader*"]

[tool.setuptools_scm]
fallback_version = "0.0.0"
local_scheme = "node-and-date"
write_to = "echoshader/_echoshader_version.py"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["E722", "E203", "T201"]

[tool.ruff.lint.isort]
known-first-party = ["echoshader"]

[tool.ruff.format]
exclude = ["*.ipynb", "**/*.ipynb"]
